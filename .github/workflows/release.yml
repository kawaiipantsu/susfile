name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Verify the tag matches CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          make_ver="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          echo "tag=$tag changelog=$make_ver"
          test "$tag" = "$make_ver"

      - name: Build archives and packages
        run: |
          make dist
          make deb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pull the CHANGELOG section for this exact version, not just the
          # first section (which is the empty [Unreleased] after a release cut).
          ver="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$ver" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f && /^\[[^]]+\]: / {exit}
            f {print}
          ' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md for $GITHUB_REF_NAME."
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "susfile $GITHUB_REF_NAME" \
            --notes "$notes" \
            $prerelease \
            dist/*.tar.gz dist/*.deb dist/SHA256SUMS
